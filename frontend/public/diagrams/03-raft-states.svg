<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1000" height="330" rx="14" fill="#000"/><text x="500" y="34" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Raft: every node is in one of three states</text><rect x="60" y="110" width="200" height="80" rx="40" fill="#000" stroke="#fff" stroke-width="1.5"/><text x="160.0" y="145.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">Follower</text><text x="160.0" y="163.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">listens for heartbeats</text><rect x="400" y="110" width="200" height="80" rx="40" fill="#000" stroke="#fff" stroke-width="1.5"/><text x="500.0" y="145.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">Candidate</text><text x="500.0" y="163.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">requests votes</text><rect x="740" y="110" width="200" height="80" rx="40" fill="#000" stroke="#fff" stroke-width="1.5"/><text x="840.0" y="145.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">Leader</text><text x="840.0" y="163.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">accepts writes</text><polyline points="260,140 400,140" fill="none" stroke="#fff" stroke-width="1.5" marker-end="url(#a)"/><text x="330" y="126" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">timeout 0.5-1.0 s</text><polyline points="600,140 740,140" fill="none" stroke="#fff" stroke-width="1.5" marker-end="url(#a)"/><text x="670" y="126" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">majority votes</text><polyline points="840,190 840,262 160,262 160,190" fill="none" stroke="#fff" stroke-width="1.5" marker-end="url(#a)"/><text x="500" y="282" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">higher term seen: step down to Follower</text><text x="500" y="226" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">A Candidate also reverts to Follower on a higher term or a lost election</text></svg>