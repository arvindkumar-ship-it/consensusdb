<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1000" height="250" rx="14" fill="#000"/><text x="500" y="34" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Anatomy of a write: SET key value</text><text x="115.0" y="92" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8a8a8a" font-weight="600" text-anchor="middle">1</text><rect x="50.0" y="104" width="130" height="56" rx="10" fill="#000" stroke="#fff" stroke-width="1.5"/><text x="115.0" y="137.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">Client</text><text x="115.0" y="186" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">POST /set</text><polyline points="180.0,132 204.0,132" fill="none" stroke="#fff" stroke-width="1.5" marker-end="url(#a)"/><text x="269.0" y="92" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8a8a8a" font-weight="600" text-anchor="middle">2</text><rect x="204.0" y="104" width="130" height="56" rx="10" fill="#000" stroke="#fff" stroke-width="1.5"/><text x="269.0" y="137.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">Router</text><text x="269.0" y="186" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">ring picks group,</text><text x="269.0" y="203" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">cached leader</text><polyline points="334.0,132 358.0,132" fill="none" stroke="#fff" stroke-width="1.5" marker-end="url(#a)"/><text x="423.0" y="92" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8a8a8a" font-weight="600" text-anchor="middle">3</text><rect x="358.0" y="104" width="130" height="56" rx="10" fill="#000" stroke="#fff" stroke-width="1.5"/><text x="423.0" y="137.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">Leader</text><text x="423.0" y="186" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">appends entry</text><text x="423.0" y="203" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">to its log</text><polyline points="488.0,132 512.0,132" fill="none" stroke="#fff" stroke-width="1.5" marker-end="url(#a)"/><text x="577.0" y="92" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8a8a8a" font-weight="600" text-anchor="middle">4</text><rect x="512.0" y="104" width="130" height="56" rx="10" fill="#000" stroke="#fff" stroke-width="1.5"/><text x="577.0" y="137.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">Followers</text><text x="577.0" y="186" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">parallel</text><text x="577.0" y="203" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">AppendEntries</text><polyline points="642.0,132 666.0,132" fill="none" stroke="#fff" stroke-width="1.5" marker-end="url(#a)"/><text x="731.0" y="92" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8a8a8a" font-weight="600" text-anchor="middle">5</text><rect x="666.0" y="104" width="130" height="56" rx="10" fill="#000" stroke="#fff" stroke-width="1.5"/><text x="731.0" y="137.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">Commit</text><text x="731.0" y="186" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">majority has it,</text><text x="731.0" y="203" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">entry commits</text><polyline points="796.0,132 820.0,132" fill="none" stroke="#fff" stroke-width="1.5" marker-end="url(#a)"/><text x="885.0" y="92" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8a8a8a" font-weight="600" text-anchor="middle">6</text><rect x="820.0" y="104" width="130" height="56" rx="10" fill="#000" stroke="#fff" stroke-width="1.5"/><text x="885.0" y="137.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">Apply + reply</text><text x="885.0" y="186" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">fsync, apply to</text><text x="885.0" y="203" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">mkdb/KV, ack</text><text x="500" y="238" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="500" text-anchor="middle">typical latency ~2 ms</text></svg>