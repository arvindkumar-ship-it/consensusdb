<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1000" height="230" rx="14" fill="#000"/><text x="500" y="34" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Adding a group: copy first, then tombstone</text><rect x="41.0" y="90" width="170" height="60" rx="10" fill="#000" stroke="#fff" stroke-width="1.5"/><text x="126.0" y="115.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">1  Block writes</text><text x="126.0" y="133.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">rebalancing flag</text><polyline points="211.0,120 228.0,120" fill="none" stroke="#fff" stroke-width="1.5" marker-end="url(#a)"/><rect x="228.0" y="90" width="170" height="60" rx="10" fill="#000" stroke="#fff" stroke-width="1.5"/><text x="313.0" y="115.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">2  Move plan</text><text x="313.0" y="133.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">owners in new ring</text><polyline points="398.0,120 415.0,120" fill="none" stroke="#fff" stroke-width="1.5" marker-end="url(#a)"/><rect x="415.0" y="90" width="170" height="60" rx="10" fill="#000" stroke="#fff" stroke-width="1.5"/><text x="500.0" y="115.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">3  Copy</text><text x="500.0" y="133.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">in order, to new group</text><polyline points="585.0,120 602.0,120" fill="none" stroke="#fff" stroke-width="1.5" marker-end="url(#a)"/><rect x="602.0" y="90" width="170" height="60" rx="10" fill="#000" stroke="#fff" stroke-width="1.5"/><text x="687.0" y="115.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">4  MOVED</text><text x="687.0" y="133.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">tombstone on old group</text><polyline points="772.0,120 789.0,120" fill="none" stroke="#fff" stroke-width="1.5" marker-end="url(#a)"/><rect x="789.0" y="90" width="170" height="60" rx="10" fill="#000" stroke="#fff" stroke-width="1.5"/><text x="874.0" y="115.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">5  Ring swap</text><text x="874.0" y="133.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">writes resume</text><text x="500" y="196" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8a" font-weight="400" text-anchor="middle">If the copy fails the operation aborts: old ring kept, no tombstone, no data loss</text></svg>